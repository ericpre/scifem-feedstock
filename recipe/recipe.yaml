context:
  name: scifem
  version: "0.27.0"
  fenics_version: "0.11.*"
  abi_version: 2.${{ nanobind_abi }}
  abi3_python: "3.12"
  build_abi3: ${{ match(python, abi3_python + ".*") and is_abi3 }}
  skip_build: ${{ match(python, ">=3.13") and is_abi3 }}
  abi3_tag: ${{ "cp312" if build_abi3 else "" }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/scifem/scifem-${{ version }}.tar.gz
  sha256: 0d839fb0f84ae72237c8037c89e6f6a96243025bcaa529a63d03b8cdd9fc489b
  patches:
    - normalize-basix-path.patch

build:
  number: 1
  skip:
    - match(python, "<3.12")
    - skip_build
  script:
    file: ${{ "build.bat" if win else "build.sh" }}
    env:
      SKBUILD_BUILD_VERBOSE: "true"
      SKBUILD_WHEEL_PY_API: ${{ abi3_tag }}
  python:
    version_independent: ${{ build_abi3 }}

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - cmake
    - if: win
      then: ninja
      else: make
    - pkg-config
    - if: build_platform != target_platform
      then:
        - if: mpi == 'openmpi'
          then: ${{ mpi }}
        - cross-python_${{ target_platform }}
        - python
        - nanobind
        - nanobind-abi
    - fenics-basix-nanobind-abi ${{ abi_version }}.*
  host:
    - fenics-libbasix ${{ fenics_version }}
    - fenics-basix ${{ fenics_version }}
    - fenics-libdolfinx ${{ fenics_version }}
    - fenics-dolfinx ${{ fenics_version }}
    - fenics-basix-nanobind-abi ${{ abi_version }}.*

    # place adios2 in host environment to ensure
    # a compatible set of dependencies is pinned
    # (usually on hdf5)
    # run_exports are then ignored because we don't actually need
    # to pin adios2
    - if: not win
      then: adios2 * mpi_${{ mpi }}_*

    - ${{ mpi | replace("impi", "impi-devel") }}
    - if: not win
      then:
        - petsc
        - petsc * ${{ scalar }}_*
    - pip
    - python
    - if: build_abi3
      then:
        - python-abi3
    - scikit-build-core
    - nanobind
    - nanobind-abi
  run:
    - python
    - fenics-basix
    - fenics-dolfinx
    - fenicsx-compat >=0.3.0
    - if: not win
      then: adios2 * mpi_${{ mpi }}_*
    - scipy
    - if: match(python, "<3.13")
      then: typing_extensions
  run_constraints:
    # require mpi build of h5py
    - h5py * mpi_${{ mpi }}_*
  ignore_run_exports:
    # lose build-time pinning since we don't link libadios
    from_package:
      - adios2

tests:
  - python:
      python_version:
        - if: build_abi3
          then: ${{ abi3_python }}.*
        - "*"
      imports:
        - scifem
      pip_check: true
  - files:
      source:
        - tests/
        - pyproject.toml
    requirements:
      run:
        - pytest
        - if: not win
          then: petsc4py
        - abi3audit
        # can't test h5py
        # until it gets builds for hdf5 1.14.4
        # - h5py
    script:
      content:
        - if: win
          then:
            - pytest -vs %TEST_FILES%
            - mpiexec -n 2 pytest -m "not serial" -vs %TEST_FILES%
          else:
            - pytest -vs ${TEST_FILES}
            - mpiexec -n 2 pytest -m "not serial" -vs ${TEST_FILES}
        - if: build_abi3
          then:
            - if: win
              then: abi3audit "%SP_DIR%/scifem/_scifem.pyd" -s -v --assume-minimum-abi3 ${{ abi3_python }}
              else: abi3audit $SP_DIR/scifem/_scifem.abi3.so -s -v --assume-minimum-abi3 ${{ abi3_python }}

      env:
        UCX_MEM_EVENTS: "no"
        MPIEXEC_TIMEOUT: "1250"
        # test_real_functionspace imports PETSc, which is unavailable on Windows.
        TEST_FILES: tests/test_bcs.py tests/test_interpolation.py tests/test_material_space.py ${{ "" if win else "tests/test_real_functionspace.py" }}

about:
  summary: Scientific Computing Tools for Finite Element Methods
  description: |
    This package contains a collection of tools for scientific computing with a focus on finite element methods.
    The tools are written in Python and are intended to be used in conjunction with the dolfinx.
  license: MIT
  license_file: LICENSE
  homepage: https://scientificcomputing.github.io/scifem
  repository: https://github.com/scientificcomputing/scifem
  documentation: https://scientificcomputing.github.io/scifem

extra:
  recipe-maintainers:
    - finsberg
    - jorgensd
    - minrk
